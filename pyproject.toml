[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osint-threat-dashboard"
version = "0.1.0"
description = "Local, evidence-led OSINT collection and experimental RTB reporting"
requires-python = ">=3.11"
dependencies = ["beautifulsoup4>=4.12,<5", "jsonschema>=4.23,<5", "h3==4.5.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
